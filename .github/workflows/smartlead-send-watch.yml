name: SmartLead send watch (envio parado grita)

# Por que existe: campanha ATIVA que para de enviar não aparece em lado nenhum
# — o painel do SmartLead continua verde. Regra da casa: nada degrada calado.
#
# O QUE NÃO É ALARME (correção do founder, 04/09): uma pausa entre toques da
# sequência é NORMAL. O e-mail 2 sai 3 dias depois do primeiro; entre um toque e
# o outro há dias legítimos de silêncio. Um vigia que grita nesses dias treina
# toda a gente a ignorá-lo — vira o "vigia que também mente".
#
# Por isso o alarme exige DUAS condições ao mesmo tempo:
#   (a) zero e-mails novos desde a medição anterior, E
#   (b) existirem leads que NUNCA receberam o primeiro toque nessa campanha.
# Com (b) falso, o silêncio é a sequência a respirar e o vigia cala-se.
# Se (b) não puder ser determinado pela API, NÃO alarma e diz isso no resumo:
# alarme adivinhado é pior do que alarme nenhum.
#
# Determinístico: python + urllib, sem LLM. Só agregados — nenhum e-mail de
# lead entra no log (regra da casa).

on:
  schedule:
    # 14:00 e 18:00 UTC = 10:00 e 14:00 em Nova Iorque (janela aberta nos dois).
    - cron: "0 14,18 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — segredos obrigatórios
        env:
          SL: ${{ secrets.SMARTLEAD_API_KEY }}
          TG: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CH: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          test -n "${SL}" || { echo "::error::secret SMARTLEAD_API_KEY ausente"; exit 1; }
          test -n "${TG}" || { echo "::error::secret TELEGRAM_BOT_TOKEN ausente — o vigia falha VERMELHO de propósito"; exit 1; }
          test -n "${CH}" || { echo "::error::secret TELEGRAM_CHAT_ID ausente"; exit 1; }

      - name: Estado anterior (cache)
        id: cache
        uses: actions/cache@v4
        with:
          path: .sl-watch
          key: sl-send-watch-${{ github.run_id }}
          restore-keys: |
            sl-send-watch-

      - name: Medir e alarmar
        env:
          SL_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, pathlib, urllib.parse, urllib.request, urllib.error

          KEY = os.environ["SL_KEY"]
          BASE = "https://server.smartlead.ai/api/v1"
          UA = {"User-Agent": "Mozilla/5.0 (Macintosh) OzvorOps/1.0", "Accept": "application/json"}

          def get(path):
              url = f"{BASE}{path}{'&' if '?' in path else '?'}api_key={KEY}"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"_http": e.code}
              except Exception as e:
                  return {"_erro": type(e).__name__}

          def nunca_tocados(cid):
              """Leads da campanha que ainda não receberam o toque 1.

              Devolve int, ou None quando a API não expõe o estado por lead —
              e None faz o vigia calar-se, nunca adivinhar. Amostra as duas
              primeiras páginas: a pergunta é "existe algum?", não "quantos ao
              certo?", e paginar 4 mil leads por um booleano é desperdício."""
              vistos, por_tocar, determinou = 0, 0, False
              for offset in (0, 100):
                  page = get(f"/campaigns/{cid}/leads?offset={offset}&limit=100")
                  rows = page.get("data") if isinstance(page, dict) else page
                  if not isinstance(rows, list) or not rows:
                      break
                  for row in rows:
                      lead = row.get("lead") if isinstance(row.get("lead"), dict) else row
                      estado = str(row.get("status") or lead.get("status") or "").upper()
                      if not estado:
                          continue
                      determinou = True
                      vistos += 1
                      # Vocabulário do SmartLead: quem ainda não entrou na
                      # sequência aparece como NOT_STARTED/PENDING/STOPPED=False.
                      if estado in ("NOT_STARTED", "PENDING", "NOTSTARTED"):
                          por_tocar += 1
              return por_tocar if determinou else None

          camps = get("/campaigns")
          if isinstance(camps, dict):
              print("RESULTADO_OZVOR" + json.dumps({"ok": False, "motivo": f"GET /campaigns falhou: {camps}"}))
              raise SystemExit(1)

          ativas, total = [], 0
          for c in camps:
              if str(c.get("status", "")).upper() not in ("ACTIVE", "START", "STARTED"):
                  continue
              a = get(f"/campaigns/{c['id']}/analytics")
              n = int(a.get("sent_count") or 0) if isinstance(a, dict) else 0
              ativas.append({"nome": c.get("name"), "enviados": n,
                             "por_tocar": nunca_tocados(c["id"])})
              total += n

          estado = pathlib.Path(".sl-watch/estado.json")
          antes = None
          if estado.exists():
              try:
                  antes = json.loads(estado.read_text()).get("total")
              except Exception:
                  antes = None
          estado.parent.mkdir(parents=True, exist_ok=True)
          estado.write_text(json.dumps({"total": total}))

          delta = None if antes is None else total - antes
          # (b) alguma campanha ativa ainda tem lead por tocar? None = não sabemos.
          por_tocar = [a["por_tocar"] for a in ativas]
          ha_por_tocar = any(v for v in por_tocar if isinstance(v, int) and v > 0)
          indeterminado = all(v is None for v in por_tocar) if por_tocar else True
          # Sem leitura anterior não há alarme: primeira execução só grava a régua.
          # Sem lead por tocar, o silêncio é a sequência a respirar entre toques.
          parado = (delta is not None and delta <= 0 and len(ativas) > 0
                    and ha_por_tocar and not indeterminado)

          if parado:
              linhas = "\n".join(
                  f"· {a['nome']}: {a['enviados']} enviados · {a['por_tocar']} leads por tocar"
                  for a in ativas)
              msg = ("🚨 SmartLead: ENVIO PARADO\n\n"
                     "Campanha ATIVA, leads que nunca receberam o toque 1, e ZERO "
                     "e-mails novos desde a última medição. Não é a sequência a "
                     "respirar entre toques — é envio travado.\n\n"
                     f"{linhas}\n\n"
                     "Janela de envio deveria estar aberta (09–18 Nova Iorque).\n"
                     "Onde olhar: quota/plano da conta no painel do SmartLead, "
                     "saúde das caixas, e se alguma campanha foi pausada na UI.")
              data = urllib.parse.urlencode({"chat_id": os.environ["TG_CHAT"], "text": msg}).encode()
              try:
                  urllib.request.urlopen(
                      urllib.request.Request(
                          f"https://api.telegram.org/bot{os.environ['TG_TOKEN']}/sendMessage",
                          data=data, headers={"Content-Type": "application/x-www-form-urlencoded"}),
                      timeout=30).read()
                  avisado = True
              except Exception as e:
                  avisado = f"FALHOU: {type(e).__name__}"
          else:
              avisado = "nao_aplicavel"

          print("RESULTADO_OZVOR" + json.dumps(
              {"ok": True, "campanhas_ativas": len(ativas), "total_enviados": total,
               "medicao_anterior": antes, "delta": delta,
               "leads_por_tocar": por_tocar,
               "estado_por_lead_indeterminado": indeterminado,
               "envio_parado": parado, "telegram": avisado}, ensure_ascii=False))
          # Envio parado é vermelho: o job falha para aparecer no painel do Actions.
          if parado:
              raise SystemExit(1)
          PYEOF
