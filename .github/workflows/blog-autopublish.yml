name: Blog auto-publish (Monday)

# Owns the weekly blog end to end, replacing the n8n "blog" trigger that used to
# die silently in Postiz (Postiz has no blog channel). The flow:
#   1. ask the VPS (flat-fee Claude) to WRITE a complete article as strict JSON
#   2. blog-ingest.mjs validates it hard and injects it into the site
#   3. open a PR (with a PAT so CI + automerge fire) → auto-merge → deploy
#   4. poll the live URL until it is actually 200. The LinkedIn+X announce is
#      NOT sent from here anymore (10.C.7): it runs as the gated
#      'blog-announce' graph (worker detects the new post in the public
#      sitemap, founder approves on Telegram, publish goes through the
#      standard runner). If the URL never goes live the job fails loudly —
#      the 15:40 Telegram watcher also reports "SEM REGISTRO blog" on Mondays.
#
# Secrets required (repo → Settings → Secrets and variables → Actions):
#   HERMES_BLOG_TOKEN  fine-grained PAT (Contents + Pull requests: RW) — opens
#                      the PR so downstream CI/automerge trigger.
#   HERMES_TASK_TOKEN  the Hermes /task bearer (same value as the n8n "hermes
#                      Ozvor" credential) — lets the Action call the VPS.

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      theme:
        description: "Optional theme/topic to steer the article"
        required: false
        default: ""

concurrency:
  group: blog-autopublish
  cancel-in-progress: false

permissions:
  contents: read   # writes happen via the PAT, not GITHUB_TOKEN

jobs:
  # Idempotência do dia (31/08: o cron das 12:00 atrasou 6h21 no agendador do
  # GitHub e disparou DEPOIS do re-dispatch manual — 2 posts na mesma segunda).
  # Um SCHEDULE só publica se ainda não existe post do dia; workflow_dispatch
  # (humano/vigia 5.D.6) passa direto — o vigia já tem o guard espelhado do
  # lado dele, então as duas direções fecham sem dupla publicação.
  precheck:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.decide.outputs.should_publish }}
    steps:
      - name: Decide (schedule pula se hoje já publicou)
        id: decide
        env:
          GH_TOKEN: ${{ secrets.HERMES_BLOG_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "should_publish=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          TODAY=$(date -u +%Y-%m-%d)
          N=$(gh pr list --repo "${{ github.repository }}" --state merged --search "head:content/blog-${TODAY} merged:${TODAY}" --json number --jq 'length' 2>/dev/null || echo 0)
          if [ "$N" = "0" ]; then
            echo "should_publish=1" >> "$GITHUB_OUTPUT"
          else
            echo "Ja existe post de hoje ($N PR) — cron atrasado sai quieto."
            echo "should_publish=0" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    needs: precheck
    if: needs.precheck.outputs.should_publish == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.HERMES_BLOG_TOKEN }}
          fetch-depth: 0

      - name: Guard — secrets present
        run: |
          test -n "${{ secrets.HERMES_TASK_TOKEN }}" || { echo "HERMES_TASK_TOKEN missing"; exit 1; }
          test -n "${{ secrets.HERMES_BLOG_TOKEN }}" || { echo "HERMES_BLOG_TOKEN missing"; exit 1; }

      - name: Generate the article on the VPS (robust, 3 attempts, output kept)
        env:
          HERMES_TASK_TOKEN: ${{ secrets.HERMES_TASK_TOKEN }}
          THEME: ${{ github.event.inputs.theme }}
        run: python3 scripts/blog-generate.py

      # The model's raw replies are the post-mortem. Before 17/08 they were
      # discarded and two Mondays failed with "no JSON object found" that
      # nobody could diagnose. Kept 14 days, always (even on success).
      - name: Keep the raw model output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blog-raw-output-${{ github.run_id }}
          path: article.raw.*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Ingest + validate into the site
        id: ingest
        run: |
          set -euo pipefail
          SLUG=$(node scripts/blog-ingest.mjs article.json)
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "Injected article: $SLUG"

      - name: Typecheck web
        run: npm ci --no-audit --no-fund && npx tsc --noEmit -p apps/web

      - name: Open PR (auto-merge armed)
        id: pr
        env:
          GH_TOKEN: ${{ secrets.HERMES_BLOG_TOKEN }}
          SLUG: ${{ steps.ingest.outputs.slug }}
        run: |
          set -euo pipefail
          BRANCH="content/blog-$(date -u +%Y-%m-%d)-${SLUG}"
          git config user.name "ozvor-blog-bot"
          git config user.email "blog@ozvor.com"
          git checkout -b "$BRANCH"
          git add "apps/web/src/app/(marketing)/blog/_content.ts" "apps/web/src/app/(marketing)/blog/posts.ts"
          git commit -m "content(blog): weekly auto-published article — ${SLUG}"
          git push origin "$BRANCH"
          gh pr create --title "content(blog): ${SLUG}" \
            --body "Auto-published weekly article (blog-autopublish.yml). Generated on the VPS, validated by scripts/blog-ingest.mjs (no em-dash, sourced, unique slug, tsc clean). Announced on LinkedIn + X only after the URL is live." \
            --label claude-ready
          echo "url=https://ozvor.com/blog/${SLUG}" >> "$GITHUB_OUTPUT"

      # 10.C.7 (sweep 02/09): este passo PUBLICAVA LinkedIn+X via /publish-async
      # SEM portão, sem crítico, sem válvula e fora de ops.agent_step — a única
      # publicação sem gate da empresa. O announce agora é um GRAFO
      # ('blog-announce', apps/api/src/lib/agent-graphs.ts): o worker detecta o
      # artigo novo no sitemap público (runBlogAnnounceCheck, segunda >=13:00
      # UTC), o founder aprova os DOIS textos no Telegram, e o publish sai pelo
      # runner padrão (válvula de cadência, circuito, guard de travessão,
      # limite do X, registro em ops.agent_step). Este passo só confirma que o
      # artigo foi ao ar — ele NÃO publica mais nada.
      - name: Wait for the article to go live (announce is gated via the blog-announce graph)
        env:
          URL: ${{ steps.pr.outputs.url }}
        run: |
          set -euo pipefail
          echo "Polling ${URL} for up to 20 min (auto-merge + deploy)..."
          LIVE=0
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" || echo 000)
            if [ "$CODE" = "200" ]; then LIVE=1; echo "live after ~$((i*30))s"; break; fi
            sleep 30
          done
          if [ "$LIVE" != "1" ]; then
            echo "Article never returned 200. The 15:40 watcher will flag SEM REGISTRO blog."
            exit 1
          fi
          echo "Artigo no ar. Announce delegado ao grafo blog-announce (gated):"
          echo "o worker detecta o post novo no sitemap ainda hoje, o founder aprova no Telegram,"
          echo "e LinkedIn+X saem pelo runner padrão. Nada é publicado por este workflow."

      # NADA DEGRADA CALADO: the blog failed silently on 04/08 (x4), 10/08 and
      # 17/08. Any failed step now writes a loud job summary and, when the
      # Telegram secrets exist, screams there too (same env contract as the
      # worker). Secrets are optional so a missing secret never hides the
      # summary itself.
      - name: Alarm on failure (Telegram + job summary)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 🔴 BLOG NÃO PUBLICOU"
            echo ""
            echo "O blog-autopublish falhou. Ver o log e o artifact blog-raw-output-${{ github.run_id }} (resposta crua do modelo)."
            echo ""
            echo "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            export MSG="BLOG NAO PUBLICOU (blog-autopublish falhou). Segunda sem artigo. Log + resposta crua do modelo em ${RUN_URL}"
            PAYLOAD=$(python3 -c 'import json,os;print(json.dumps({"chat_id":os.environ["TG_CHAT"],"text":os.environ["MSG"]}))')
            curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null || true
          else
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID not set as Actions secrets — alarm only in the job summary."
          fi
