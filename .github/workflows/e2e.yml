name: E2E Tests

# HONEST GATE (#146): a failing blocking suite FAILS this workflow run.
# The old job-level `continue-on-error: true` meant the nightly failed its
# tests every single run while the workflow concluded SUCCESS — weeks of
# invisible red. That is gone:
#   - chromium-desktop is BLOCKING: it fails, the run is red.
#   - webkit-mobile runs as its own explicitly NON-BLOCKING step (#170) on
#     nightly/dispatch only — visible in the step name, never silent.
#   - a failing run on main (schedule/dispatch) alarms on Telegram, same
#     pattern as blog-autopublish.yml; missing secrets degrade to the job
#     summary only, never hide the red.
# When to run is unchanged (issue #143 — the fast required signal is the
# "Smoke" job in ci.yml): on demand (workflow_dispatch), nightly (schedule),
# and on PRs that touch high-risk UI / auth / billing / admin surfaces.
# "Playwright E2E" is NOT yet a required branch-protection check — the founder
# flips that once a few nightly runs prove the gate stable (command in the
# #146 PR body).
on:
  workflow_dispatch: {}
  schedule:
    # 06:00 UTC nightly full regression sweep (advisory).
    - cron: "0 6 * * *"
  pull_request:
    branches: [main]
    # Only auto-run on PRs that change high-risk surfaces where a full browser
    # pass earns its latency. Everything else relies on the fast Smoke gate.
    paths:
      - "apps/web/src/middleware.ts"
      - "apps/web/src/app/**/login/**"
      - "apps/web/src/app/**/account/**"
      - "apps/web/src/app/**/admin/**"
      - "apps/web/src/app/**/kit/**"
      - "apps/web/src/app/api/**"
      - "apps/api/src/routes/billing.ts"
      - "apps/api/src/routes/checkout.ts"
      - "apps/api/src/auth/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - ".github/workflows/e2e.yml"

# Only run E2E on PRs targeting main (not on every push to feature branches)
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  # Test database for E2E (apps connect to this)
  DATABASE_URL: "postgres://postgres:test@localhost:5432/organic_posts_e2e"
  REDIS_URL: "redis://localhost:6379"
  # Stripe test mode — no real payments
  STRIPE_TEST_MODE: "true"
  STRIPE_SECRET_KEY: "sk_test_placeholder_for_e2e"
  STRIPE_WEBHOOK_SECRET: "whsec_placeholder_for_e2e"
  # App URLs for Playwright
  NEXT_PUBLIC_API_URL: "http://localhost:3001"
  WEB_ORIGIN: "http://localhost:3000"
  PORT: "3001"
  # Auth bypass for E2E test sessions. The API middleware reads DEV_AUTH_BYPASS
  # (not TEST_AUTH_BYPASS) and only honours it because NODE_ENV=test (never in
  # production). Without this, authenticated routes 401 in E2E.
  DEV_AUTH_BYPASS: "1"
  # Web-side counterpart of DEV_AUTH_BYPASS. The middleware honours an
  # "e2e_session" cookie only when NODE_ENV=test AND this is "1" — two
  # independent conditions, neither reachable in production.
  E2E_TEST_SESSION: "1"
  # SUPABASE_URL is required by the API config validation (apps/api/src/config.ts)
  # — the server refuses to boot without it. A placeholder URL is fine for E2E
  # because auth is bypassed; no real Supabase calls are made.
  SUPABASE_URL: "https://demo.supabase.co"
  DPA_CURRENT_VERSION: "1.0"
  OAUTH_TOKEN_KEY: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
  DEFAULT_TENANT_REGION: "us"

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    # NO job-level continue-on-error (#146): that one line was the whole
    # false-green. The 2026-08-20 nightly (run 32340369795) failed 15 tests
    # and still concluded "success" because of it. Now only the webkit-mobile
    # STEP below is allowed to fail without failing the job — explicitly.
    # Budget note: the 75-min cap predates the CSP fix; the same nightly ran
    # the full matrix in ~11 min wall clock. Kept generous on purpose — a
    # timeout now fails the run loudly instead of being swallowed.
    timeout-minutes: 75

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test
          POSTGRES_DB: organic_posts_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:migrate

      - name: Build apps for E2E
        run: npm run build

      - name: Install Playwright browsers
        # PR runs are chromium-only (Hermes review #220): halves browser time so
        # the suite fits the budget. Nightly/dispatch keep the full matrix.
        run: npx playwright install --with-deps ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium webkit' }}

      - name: Start API server
        run: |
          npm run start --workspace=apps/api &
          echo "API_PID=$!" >> $GITHUB_ENV
          # Wait for API healthcheck
          timeout 30 bash -c 'until curl -sf http://localhost:3001/healthz; do sleep 1; done'
        env:
          NODE_ENV: "test"

      - name: Start Next.js app
        run: |
          npm run start --workspace=apps/web &
          echo "WEB_PID=$!" >> $GITHUB_ENV
          # Wait until Next.js ACCEPTS connections. We do NOT require the full
          # response body: a streaming SSR response can keep a single request
          # open longer than the probe, so we treat any curl exit OTHER than 7
          # (connection refused) as "server is up". --max-time bounds each probe
          # so a slow/streaming body never blocks the whole wait.
          timeout 90 bash -c 'until curl -s -o /dev/null --connect-timeout 3 --max-time 8 http://localhost:3000; ec=$?; [ "$ec" -ne 7 ]; do echo "waiting for web (curl exit $ec)"; sleep 2; done'
        env:
          NODE_ENV: "test"
          # `next start` reads PORT; the job-level PORT=3001 is the API's port, so
          # without this the web server collides with the API ("Failed to start
          # server") and never comes up on :3000. Pin it to 3000.
          PORT: "3000"

      - name: Run Playwright E2E — chromium (BLOQUEANTE)
        # The blocking suite (#146): a red here fails the step, the job and
        # the workflow run. Runs on every trigger (PRs stay chromium-only per
        # Hermes review #220; nightly/dispatch get webkit on top, below).
        run: npx playwright test --project=chromium-desktop
        env:
          CI: "true"
          BASE_URL: "http://localhost:3000"

      - name: Run Playwright E2E — webkit-mobile (não-bloqueante, #170)
        # Nightly/dispatch only, and EXPLICITLY non-blocking: this is the one
        # place continue-on-error survives, scoped to this step and visible in
        # its name. #170's root cause (CSP upgrade-insecure-requests killing
        # all client JS on http://localhost in WebKit) is fixed in this PR and
        # the project is green locally — once a few nightlies confirm it in
        # the runner, delete the continue-on-error and let it block too.
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: npx playwright test --project=webkit-mobile
        env:
          CI: "true"
          BASE_URL: "http://localhost:3000"

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright traces (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      # NADA DEGRADA CALADO (#146): the blocking suite failing on main must
      # scream, not just tint a badge nobody watches. Same env contract as
      # blog-autopublish.yml. Secrets are optional so their absence never
      # hides the job summary — and the job is ALREADY red at this point
      # regardless (this step only reports; it cannot rescue the run).
      - name: Alarm on failure (Telegram + job summary)
        if: failure() && github.event_name != 'pull_request'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 🔴 E2E VERMELHO NA MAIN"
            echo ""
            echo "A suite Playwright bloqueante (chromium) falhou na main. Ver o log e o artifact playwright-report."
            echo ""
            echo "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            export MSG="E2E VERMELHO NA MAIN (Playwright chromium falhou no run agendado). Report + traces em ${RUN_URL}"
            PAYLOAD=$(python3 -c 'import json,os;print(json.dumps({"chat_id":os.environ["TG_CHAT"],"text":os.environ["MSG"]}))')
            curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null || true
          else
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID não configurados como Actions secrets — alarme só no job summary."
          fi

      - name: Stop servers
        if: always()
        run: |
          kill $API_PID 2>/dev/null || true
          kill $WEB_PID 2>/dev/null || true
