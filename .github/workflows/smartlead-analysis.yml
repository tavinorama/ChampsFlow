name: SmartLead lead analysis (one-shot, founder-triggered)

# Análise das leads existentes no SmartLead — código DETERMINÍSTICO (python,
# sem LLM, sem VPS). A chave vem do secret SMARTLEAD_API_KEY (o GitHub Actions
# mascara secrets em qualquer log). Saída = SÓ AGREGADOS: nenhum e-mail/nome
# de lead é impresso. workflow_dispatch apenas.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Analyze (deterministic)
        env:
          SL_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${SL_KEY}" || { echo "::error::secret SMARTLEAD_API_KEY ausente — adicionar em Settings > Secrets and variables > Actions"; exit 1; }
          python3 - <<'PYEOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, urllib.request, urllib.error

          KEY = os.environ["SL_KEY"]
          BASE = "https://server.smartlead.ai/api/v1"

          def get(path):
              url = f"{BASE}{path}{'&' if '?' in path else '?'}api_key={KEY}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Macintosh) OzvorOps/1.0", "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return {"_http_error": e.code, "_body_head": e.read().decode(errors="replace")[:200]}
              except Exception as e:
                  return {"_error": type(e).__name__}

          camps = get("/campaigns")
          out = {"ok": True, "campanhas": [], "total_leads": 0}
          if isinstance(camps, dict):
              print("RESULTADO_OZVOR" + json.dumps({"ok": False, "motivo": f"GET /campaigns falhou: {camps}"}))
              raise SystemExit(1)
          for c in camps:
              cid = c.get("id")
              row = {"id": cid, "nome": c.get("name"), "status": c.get("status")}
              stats = get(f"/campaigns/{cid}/analytics")
              if isinstance(stats, dict) and "_http_error" not in stats and "_error" not in stats:
                  for k_src, k_dst in [("sent_count","enviados"),("open_count","abertos"),("reply_count","respostas"),("bounce_count","bounces"),("total_count","leads")]:
                      if k_src in stats and stats[k_src] is not None:
                          row[k_dst] = stats[k_src]
              try:
                  out["total_leads"] += int(row.get("leads") or 0)
              except (TypeError, ValueError):
                  pass
              out["campanhas"].append(row)
          out["listas_orfas"] = "API v1 nao expoe listas fora de campanha"
          out["lead_finder_api"] = "nao (creditos de prospeccao = so via UI)"
          print("RESULTADO_OZVOR" + json.dumps(out, ensure_ascii=False))
          PYEOF
