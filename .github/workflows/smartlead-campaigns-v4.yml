name: SmartLead campaigns v4 (AI Geo Search + AI Audit Stack, founder-triggered)

# As DUAS campanhas frias de 17/09 (copy v4, aprovada pelo founder no mesmo dia):
# 4 toques (0/3/7/14), variantes A/B nos toques 1 e 2, e cada lead personalizada
# por OFÍCIO e CIDADE (trade, city, buyer_question, job, pain_task, lost_hour).
#
# A copy vive em docs/departments/sales/campaigns-v4.json e as regras da casa
# correm sobre ela ANTES de qualquer chamada (1º toque sem link, 1 pergunta,
# 40-80 palavras, frases <=12 palavras, sem travessão, opt-out literal). Uma
# revisão de texto é um edit nesse ficheiro — este workflow não muda.
#
#   action=create  cria/atualiza as duas campanhas DRAFTED com sequências,
#                  horário (seg-sex 09-18 NY, 80 leads novas/dia) e settings, e
#                  LÊ DE VOLTA as variantes: "gravou" não é "está lá".
#   action=load    move as leads NUNCA TOCADAS (status STARTED) das campanhas de
#                  origem para as duas novas, com os campos preenchidos. Lead
#                  sem ofício reconhecido, sem cidade, sem primeiro nome, com
#                  STOP, fora dos EUA, franquia ou site morto NÃO entra.
#
#   action=prospect  SmartProspect por API: a busca e GRATIS (ensaio); com
#                  confirm=yes desbloqueia ATE `limit` e-mails (1 credito cada),
#                  carrega so os VERIFICADOS e personalizaveis nas duas campanhas.
#
# TRAVAS: confirm=no (default) é ENSAIO — nada é criado, nada é movido, só
# agregados. Nunca há ação start: quem inicia é o founder, pelo
# smartlead-launch.yml (confirm=GO). Campanha de destino ativa = abortado
# (adicionar lead a campanha ativa é enviar e-mail). Nenhum e-mail, nome de
# pessoa ou telefone é impresso.

on:
  workflow_dispatch:
    inputs:
      action:
        description: "create | load | prospect | prune | block | pace | inspect (so leitura) | deliverability (so leitura: SPF, DKIM e DMARC dos dominios de envio)"
        required: true
        default: "create"
      confirm:
        description: "yes = executa de verdade · qualquer outra coisa = ENSAIO"
        required: false
        default: "no"
      geo_name:
        description: "Nome da campanha AI Geo Search (vazio = default do ficheiro de copy)"
        required: false
        default: ""
      stack_name:
        description: "Nome da campanha AI Audit Stack (vazio = default do ficheiro de copy)"
        required: false
        default: ""
      sources:
        description: "load: ids das campanhas de origem (só leads STARTED saem delas)"
        required: false
        default: "3741204,3783524,3783526"
      touched_sources:
        description: "load: ids de campanhas JA ENVIADAS cujas leads COMPLETED podem ser reusadas (sai bounce, resposta e STOP, lidos do proprio SmartLead). Vazio = nenhuma"
        required: false
        default: ""
      cap:
        description: "load: teto de leads por campanha de destino (lista <=800)"
        required: false
        default: "800"
      trade:
        description: "prospect: oficio a procurar no SmartProspect (roofing, hvac, plumbing, remodeling, electrical, ...)"
        required: false
        default: "roofing"
      limit:
        description: "prospect: teto de CREDITOS desta corrida (1-500; 1 credito por e-mail encontrado). Sem confirm=yes nada e gasto"
        required: false
        default: "25"
      filter_id:
        description: "prospect: RECOLHER um desbloqueio ja feito (filter_id do resultado anterior). Nao gasta credito. Vazio = busca nova"
        required: false
        default: ""
      per_day:
        description: "pace: leads NOVAS por dia, POR campanha (1-500)"
        required: false
        default: "100"
      days:
        description: "pace: keep (mantem os dias atuais) | all (7 dias) | weekdays (seg-sex)"
        required: false
        default: "keep"
      site_check:
        description: "load: yes = só entra lead cujo site responde (HTTP <400)"
        required: false
        default: "yes"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Copy rules (always, before anything touches SmartLead)
        run: python3 scripts/smartlead/campaigns_v4.py validate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Run
        env:
          SL_KEY: ${{ secrets.SMARTLEAD_API_KEY }}
          ACTION: ${{ github.event.inputs.action }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          GEO_NAME: ${{ github.event.inputs.geo_name }}
          STACK_NAME: ${{ github.event.inputs.stack_name }}
          SOURCES: ${{ github.event.inputs.sources }}
          CAP: ${{ github.event.inputs.cap }}
          TOUCHED: ${{ github.event.inputs.touched_sources }}
          SITE_CHECK: ${{ github.event.inputs.site_check }}
          PER_DAY: ${{ github.event.inputs.per_day }}
          DAYS: ${{ github.event.inputs.days }}
          TRADE: ${{ github.event.inputs.trade }}
          LIMIT: ${{ github.event.inputs.limit }}
          FILTER_ID: ${{ github.event.inputs.filter_id }}
        run: |
          set -euo pipefail
          test -n "${SL_KEY}" || { echo "::error::secret SMARTLEAD_API_KEY ausente"; exit 1; }
          case "${ACTION}" in create|load|prospect|prune|inspect|block|pace|deliverability) ;; *) echo "::error::action tem de ser create, load, prospect, prune, inspect, block, pace ou deliverability"; exit 1;; esac
          args=("${ACTION}")
          [ -n "${GEO_NAME}" ] && args+=(--geo-name "${GEO_NAME}")
          [ -n "${STACK_NAME}" ] && args+=(--stack-name "${STACK_NAME}")
          if [ "${ACTION}" = "load" ]; then
            args+=(--sources "${SOURCES}" --cap "${CAP}")
            [ "${SITE_CHECK}" = "yes" ] || args+=(--no-site-check)
            [ -n "${TOUCHED}" ] && args+=(--touched-sources "${TOUCHED}")
          fi
          if [ "${ACTION}" = "pace" ]; then
            args+=(--per-day "${PER_DAY}" --days "${DAYS}")
          fi
          if [ "${ACTION}" = "prospect" ]; then
            args+=(--trade "${TRADE}" --limit "${LIMIT}")
            [ -n "${FILTER_ID}" ] && args+=(--filter-id "${FILTER_ID}")
          fi
          [ "${CONFIRM}" = "yes" ] && args+=(--confirm)
          python3 scripts/smartlead/campaigns_v4.py "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
