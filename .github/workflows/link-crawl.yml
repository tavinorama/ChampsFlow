name: Link Health

# Scheduled sitemap + internal-link 200 crawl of production (P3.4). Catches a
# 404/500 the moment it appears — a broken nav/footer/CTA link or a sitemap
# entry that points at a page that no longer renders (we've shipped both before).
# Read-only: it only issues public GET requests. No secrets, no side effects.
#
# This is ADVISORY monitoring, not a per-PR merge gate — it runs on a cadence
# and on demand, and fails loudly (non-zero exit) when a public URL is broken so
# the failure surfaces in the Actions tab / notifications.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Base URL to crawl (default: production)"
        required: false
        default: "https://ozvor.com"
  schedule:
    # 07:00 UTC daily — offset an hour after the nightly E2E sweep (06:00).
    - cron: "0 7 * * *"

# Only one crawl at a time; a newer run supersedes an in-flight one.
concurrency:
  group: link-crawl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crawl:
    name: Sitemap + internal-link 200 check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 10.B.4 — um crawler que só tinge a aba Actions é um vigia mudo.
      # Mesmo contrato do blog-autopublish: secrets ausentes = vermelho já aqui.
      - name: Assert the alarm channel is wired (TELEGRAM secrets exist)
        run: |
          test -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" || { echo "TELEGRAM_BOT_TOKEN missing — o vigia estaria mudo"; exit 1; }
          test -n "${{ secrets.TELEGRAM_CHAT_ID }}" || { echo "TELEGRAM_CHAT_ID missing — o vigia estaria mudo"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # No `npm ci` — the crawler is dependency-free (Node global fetch only).
      - name: Crawl links
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://ozvor.com' }}
        run: node scripts/crawl-links.mjs "$BASE_URL"

      # 10.B.4 — link quebrado em produção agora grita no Telegram (antes: só
      # o run vermelho, que ninguém olha). O job já está vermelho aqui; este
      # passo só reporta — nunca resgata o run.
      - name: Alarm on broken links (Telegram + job summary)
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## 🔴 LINK QUEBRADO EM PRODUÇÃO"
            echo ""
            echo "O crawl diário achou link/sitemap com resposta != 200. Ver o log do passo 'Crawl links'."
            echo ""
            echo "$RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            export MSG="LINK QUEBRADO EM PRODUCAO: o crawl diario (link-crawl) achou URL com resposta != 200. Log: ${RUN_URL}"
            PAYLOAD=$(python3 -c 'import json,os;print(json.dumps({"chat_id":os.environ["TG_CHAT"],"text":os.environ["MSG"]}))')
            curl -sS --max-time 20 -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null || true
          else
            echo "TELEGRAM secrets not set — alarm only in the job summary."
          fi
